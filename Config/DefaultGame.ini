[/Script/UnrealEd.ProjectPackagingSettings]
; Actors colour their BasicShapes meshes by making a dynamic instance of
; BasicShapeMaterial at runtime (LoadObject). Nothing hard-references it - the shape
; meshes themselves use DefaultMaterial - so force it to cook or the packaged build
; renders everything grey.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Only our map goes into the build (without this line the cooker takes every map in the project).
+MapsToCook=(FilePath="/Game/KillingPart/Maps/Lvl_Mat")
; Our maps and materials, which the code loads by path (LoadObject) and the cooker can't see on its own.
; (T8: the mannequin is no longer cooked: she is SM_Heroine in /Game/KillingPart/Heroine.)
+DirectoriesToAlwaysCook=(Path="/Game/KillingPart")
; Game data (Content/Data/KillingPart.json) is read from disk at runtime, not cooked.
+DirectoriesToAlwaysStageAsUFS=(Path="Data")
; v1.1: the WeLoveIndies intro (their licence asks for it in non-commercial releases).
; Content/Movies/WLI_Intro.mp4 plays at every launch before the title, through the
; engine's startup movie player (WindowsMoviePlayer, Media Foundation); a click or any key skips it.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Movies")

[/Script/MoviePlayer.MoviePlayerSettings]
bWaitForMoviesToComplete=True
bMoviesAreSkippable=True
+StartupMovies=WLI_Intro
